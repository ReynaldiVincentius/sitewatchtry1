# .github/workflows/check-sites.yml
# Scheduled uptime checks: runs scripts/check-sites.js every 30 minutes
# and on manual trigger, then commits updated data/status.json back.
# Uses only the default GITHUB_TOKEN — no extra secrets required.
name: Uptime check

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run uptime checks
        run: node scripts/check-sites.js

      - name: Commit updated status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/status.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🤖 Automated uptime check"
            git push
          fi
